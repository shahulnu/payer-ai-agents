[project]
name = "payer-ai-agents"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.0",
    "langchain-anthropic>=1.7.10",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.22",
    "mcp>=1.30.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
